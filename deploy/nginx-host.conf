# ─────────────────────────────────────────────────────────────────────────────
# /etc/nginx/sites-available/helios-soc
#
# Host-level nginx for Azure VM  4.188.228.167
# Handles TLS termination, rate limiting, and security headers.
# The Docker container (helios-soc) runs on localhost:8080.
# ─────────────────────────────────────────────────────────────────────────────

# Rate-limiting zones
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;

# ── HTTP: redirect all traffic to HTTPS ──────────────────────────────────────
server {
    listen      80;
    listen [::]:80;
    server_name 4.188.228.167;

    # Allow Let's Encrypt ACME challenges (needed if you add a domain later)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ─────────────────────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 4.188.228.167;

    # ── TLS ──────────────────────────────────────────────────────────────────
    # Self-signed cert for IP-only access.
    # Replace with real certs when a domain name is pointed to this IP:
    #   sudo certbot --nginx -d your-domain.com
    ssl_certificate     /etc/nginx/ssl/helios-soc.crt;
    ssl_certificate_key /etc/nginx/ssl/helios-soc.key;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout       1d;
    ssl_session_cache         shared:SSL:50m;
    ssl_session_tickets       off;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains"                                                                                                                        always;
    add_header X-Frame-Options           "DENY"                                                                                                                                                        always;
    add_header X-Content-Type-Options    "nosniff"                                                                                                                                                     always;
    add_header X-XSS-Protection          "1; mode=block"                                                                                                                                               always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"                                                                                                                             always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://4.188.228.167 wss://4.188.228.167; frame-ancestors 'none';" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()"                                                                                                                    always;

    # ── General rate limit ────────────────────────────────────────────────────
    limit_req zone=general burst=120 nodelay;

    # ── Health check (unauthenticated, no rate limit) ─────────────────────────
    location = /health {
        limit_req off;
        proxy_pass http://127.0.0.1:8080/health;
    }

    # ── Wazuh auth endpoint – strict rate limit ───────────────────────────────
    location /api/wazuh/security/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── WebSocket – live alert stream ─────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    # ── All other traffic (React SPA + API proxy) ─────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
